<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin · E-WasteBiz</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <script>var t="dark";try{t=localStorage.getItem("ewb-theme")||"dark"}catch(e){}document.documentElement.dataset.theme=t</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-page="admin">

  <!-- Login -->
  <section class="login-wrap" id="login" hidden>
    <div class="bg-grid"></div>
    <div class="glow-orb" style="width:420px;height:420px;left:50%;top:-160px;transform:translateX(-50%);background:rgba(34,197,94,.22)"></div>
    <div class="form-card login-card">
      <a class="brand" href="../index.html">
        <img class="logo-l" src="../assets/img/logo-icon.png" alt="" width="40">
        <img class="logo-d" src="../assets/img/logo-icon-dark.png" alt="" width="40">
        <span class="brand-text"><b>E-WASTE<span>BIZ</span></b><small>Admin</small></span>
      </a>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to manage leads and website content.</p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="lu">Username</label><input class="input" id="lu" name="username" autocomplete="username" required></div>
        <div class="field"><label for="lp">Password</label><input class="input" id="lp" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn--primary btn--lg btn--block" type="submit" style="margin-top:18px"><span class="spinner"></span>Sign in</button>
        <div class="form-msg" role="alert"></div>
      </form>
    </div>
  </section>

  <!-- App -->
  <div class="shell" id="app" hidden>
    <aside class="side">
      <a class="brand" href="../index.html" target="_blank" rel="noopener">
        <img class="logo-l" src="../assets/img/logo-icon.png" alt="" width="36">
        <img class="logo-d" src="../assets/img/logo-icon-dark.png" alt="" width="36">
        <span class="brand-text"><b>E-WASTE<span>BIZ</span></b><small>Admin panel</small></span>
      </a>
      <div class="side-label">Sales</div>
      <a class="tab" href="#overview" data-tab="overview"></a>
      <a class="tab" href="#leads" data-tab="leads"></a>
      <div class="side-label">Website</div>
      <a class="tab" href="#content" data-tab="content"></a>
      <a class="tab" href="#certificates" data-tab="certificates"></a>
      <a class="tab" href="#testimonials" data-tab="testimonials"></a>
      <a class="tab" href="#faqs" data-tab="faqs"></a>
      <a class="tab" href="#clients" data-tab="clients"></a>
      <a class="tab" href="#partners" data-tab="partners"></a>
      <a class="tab" href="#gallery" data-tab="gallery"></a>
      <div class="side-label">Account</div>
      <a class="tab" href="#settings" data-tab="settings"></a>
      <div class="side-foot">
        <a class="btn btn--ghost btn--sm btn--block" href="../index.html" target="_blank" rel="noopener">View website ↗</a>
        <button class="btn btn--ghost btn--sm btn--block" id="logout" type="button">Log out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="viewTitle">Overview</h1>
        <div class="actions">
          <button class="btn btn--ghost btn--sm hide-m" id="refresh" type="button">Refresh</button>
          <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode"></button>
          <a class="icon-btn" href="../index.html" target="_blank" rel="noopener" aria-label="View website" id="viewSite"></a>
          <button class="icon-btn" id="logoutM" type="button" aria-label="Log out" style="display:none"></button>
        </div>
      </header>
      <div class="content" id="view"></div>
    </div>
    <nav class="mob-tabs" id="mobTabs"></nav>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="drawer-bg" id="drawerBg"></div>
  <div class="chart-tip" id="tip"></div>
  <div class="toasts" id="toasts"></div>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
